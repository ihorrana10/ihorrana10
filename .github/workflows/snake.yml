name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ihorrana10
          outputs: |
            dist/github-snake.svg?color_snake=%23FF2FAE&color_dots=%230D0B12,%235A123F,%239B1B68,%23D9278D,%23FF2FAE

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
