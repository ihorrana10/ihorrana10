name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ihorrana10
          outputs: |
            dist/github-snake.svg?color_snake=%23FF69E1&color_dots=%23160B1F,%233A123F,%236E1F68,%23C026A6,%23FF4FD8
            dist/github-snake-dark.svg?color_snake=%23FF69E1&color_dots=%23160B1F,%233A123F,%236E1F68,%23C026A6,%23FF4FD8

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
