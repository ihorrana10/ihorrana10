name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ihorrana10
          outputs: |
            dist/github-snake.svg?color_snake=#FF69E1&color_dots=#160B1F,#3A123F,#6E1F68,#C026A6,#FF4FD8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF69E1&color_dots=#160B1F,#3A123F,#6E1F68,#C026A6,#FF4FD8

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
