name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ihorrana10
          outputs: |
            dist/github-snake.svg?color_snake=#FF4FD8&color_dots=#160B1F,#3A123F,#6E1F68,#C026A6,#FF4FD8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF4FD8&color_dots=#160B1F,#3A123F,#6E1F68,#C026A6,#FF4FD8

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
